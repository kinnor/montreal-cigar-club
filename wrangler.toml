# Cloudflare Pages configuration — Montreal Cigar Club
# Deploy:  npx wrangler pages deploy web_root --project-name=montreal-cigar-club
# Docs:    https://developers.cloudflare.com/pages/functions/wrangler-configuration/

name = "montreal-cigar-club"
compatibility_date = "2026-08-01"
pages_build_output_dir = "web_root"

# Custom domains are attached in the dashboard (Workers & Pages -> montreal-cigar-club -> Custom domains):
#   montrealcigarclub.ca   (canonical)
#   www.montrealcigarclub.ca (optional, redirect to apex via Redirect Rule)
# The mtlcigarclub.ca -> montrealcigarclub.ca 301 lives in workers/redirect/.

# KV store for membership applications and RSVPs (functions/api/*)
[[kv_namespaces]]
binding = "MCC_SUBMISSIONS"
id = "86439abda36f425dbd499949866a6344"

# Email notifications (Cloudflare Email Service, REST API — Pages Functions do not support the send_email binding).
# Requires: (1) montrealcigarclub.ca onboarded to Email Sending, (2) secret EMAIL_API_TOKEN with Email Sending permission:
#   wrangler pages secret put EMAIL_API_TOKEN --project-name=montreal-cigar-club

[vars]
MAIL_TO = "admissions@montrealcigarclub.ca"
MAIL_FROM = "admissions@montrealcigarclub.ca"
